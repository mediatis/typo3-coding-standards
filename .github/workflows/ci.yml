'on':
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
permissions:
    contents: read
jobs:
    code-quality:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php_version:
                    - '8.2'
                    - '8.3'
                    - '8.4'
                    - '8.5'
        steps:
            -
                name: Checkout
                uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            -
                name: 'Install PHP'
                uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
                with:
                    php-version: '${{ matrix.php_version }}'
                    coverage: none
                    tools: 'composer:v2.4'
            -
                name: 'Show Composer version'
                run: 'composer --version'
            -
                name: 'Show the Composer configuration'
                run: 'composer config --global --list'
            -
                name: 'Cache dependencies installed with composer'
                uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
                with:
                    key: 'php${{ matrix.php_version }}'
                    path: ~/.cache/composer
                    restore-keys: "php${{ matrix.php_version }}-composer-\n"
            -
                name: 'Install Composer dependencies'
                run: "composer install --no-progress\n"
            -
                name: 'Run command'
                run: "composer ci:static\n"
    trivy:
        name: trivy
        runs-on: ubuntu-latest
        steps:
            -
                name: 'Checkout code'
                uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
            -
                name: 'Run Trivy vulnerability scanner in repo mode'
                uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
                with:
                    scan-type: fs
                    scan-ref: .
                    format: table
                    vuln-type: library
                    severity: 'UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL'
                    exit-code: '1'
    semgrep:
        name: semgrep
        runs-on: ubuntu-latest
        container:
            image: semgrep/semgrep
        if: "(github.actor != 'dependabot[bot]')"
        steps:
            -
                uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            -
                run: 'semgrep scan --config auto --error'
    code-tests:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php_version:
                    - '8.2'
                    - '8.3'
                    - '8.4'
                    - '8.5'
        steps:
            -
                name: Checkout
                uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
            -
                name: 'Install PHP'
                uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
                with:
                    php-version: '${{ matrix.php_version }}'
                    coverage: none
                    tools: 'composer:v2.4'
            -
                name: 'Show Composer version'
                run: 'composer --version'
            -
                name: 'Show the Composer configuration'
                run: 'composer config --global --list'
            -
                name: 'Cache dependencies installed with composer'
                uses: actions/cache@6f8efc29b200d32929f49075959781ed54ec270c # v3
                with:
                    key: 'php${{ matrix.php_version }}'
                    path: ~/.cache/composer
                    restore-keys: "php${{ matrix.php_version }}-composer-\n"
            -
                name: 'Install Composer dependencies'
                run: "composer install --no-progress\n"
            -
                name: 'Run command'
                run: "composer ci:tests\n"
